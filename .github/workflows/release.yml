name: Build and Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 35
        build-tools: 35.0.0

    - name: Add build-tools to PATH
      run: echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH

    - name: Decode and save keystore
      env:
        BASE64_KEYSTORE: ${{ secrets.BASE64_KEYSTORE }}
      run: |
        echo $BASE64_KEYSTORE | base64 --decode > my-release-key.jks

    - name: Build APK and AAB
      run: ./gradlew assembleRelease bundleRelease

    - name: Sign APK and AAB
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore my-release-key.jks app/build/outputs/apk/release/app-release-unsigned.apk $KEY_ALIAS -storepass $KEYSTORE_PASSWORD -keypass $KEY_PASSWORD
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore my-release-key.jks app/build/outputs/bundle/release/app-release.aab $KEY_ALIAS -storepass $KEYSTORE_PASSWORD -keypass $KEY_PASSWORD

    - name: Align APK
      run: zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk

    - name: Create Release
      id: create_release
      uses: actions/github-script@v7
      with:
        script: |
          const github = require('@actions/github');
          const context = github.context;
          const { data: release } = await github.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: context.ref,
            name: `Release ${context.ref}`,
            draft: false,
            prerelease: false,
            generate_release_notes: true
          });
          return release.upload_url;

    - name: Upload APK
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = 'app/build/outputs/apk/release/app-release.apk';
          const content = fs.readFileSync(path);
          await github.repos.uploadReleaseAsset({
            url: ${{ steps.create_release.outputs.result }},
            headers: {
              'content-type': 'application/vnd.android.package-archive',
              'content-length': content.length
            },
            name: 'app-release.apk',
            data: content
          });

    - name: Upload AAB
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = 'app/build/outputs/bundle/release/app-release.aab';
          const content = fs.readFileSync(path);
          await github.repos.uploadReleaseAsset({
            url: ${{ steps.create_release.outputs.result }},
            headers: {
              'content-type': 'application/octet-stream',
              'content-length': content.length
            },
            name: 'app-release.aab',
            data: content
          });
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}