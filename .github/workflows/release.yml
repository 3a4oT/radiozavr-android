name: Build and Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Decode keystore
        env:
          BASE64_KEYSTORE: ${{ secrets.BASE64_KEYSTORE }}
        run: |
          mkdir -p signing
          echo "$BASE64_KEYSTORE" | base64 --decode > signing/release-key.jks

      - name: Compute versionCode from tag
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ env.VERSION }}"
          echo "VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> $GITHUB_ENV

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease -PversionName=${{ env.VERSION }} -PversionCode=${{ env.VERSION_CODE }}

      - name: Rename artifacts
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/radiozavr-${{ env.VERSION }}.apk
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/radiozavr-${{ env.VERSION }}.aab

      - name: Upload artifacts for next jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/release/radiozavr-${{ env.VERSION }}.apk
            app/build/outputs/bundle/release/radiozavr-${{ env.VERSION }}.aab
            app/build/outputs/mapping/release/mapping.txt

  github-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.VERSION }} \
            artifacts/app/build/outputs/apk/release/radiozavr-${{ env.VERSION }}.apk \
            artifacts/app/build/outputs/bundle/release/radiozavr-${{ env.VERSION }}.aab \
            --title "Release ${{ env.VERSION }}" \
            --generate-notes
        working-directory: ${{ github.workspace }}

  play-store:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Decode Play Store credentials
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        run: echo "$PLAY_STORE_CREDENTIALS" | base64 --decode > fastlane/play-store-credentials.json

      - name: Upload to Play Store Internal Track
        env:
          AAB_PATH: ${{ github.workspace }}/artifacts/app/build/outputs/bundle/release/radiozavr-${{ env.VERSION }}.aab
          MAPPING_PATH: ${{ github.workspace }}/artifacts/app/build/outputs/mapping/release/mapping.txt
        run: bundle exec fastlane upload_internal
