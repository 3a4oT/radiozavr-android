name: Build and Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0

      - name: Add build-tools to PATH
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> $GITHUB_PATH

      - name: Decode and save keystore
        env:
          BASE64_KEYSTORE: ${{ secrets.BASE64_KEYSTORE }}
        run: |
          echo $BASE64_KEYSTORE | base64 --decode > my-release-key.jks

      - name: Build APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Rename artifacts
        run: |
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/radio-lux-fm-${{ env.VERSION }}.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/radio-lux-fm-${{ env.VERSION }}.aab

      - name: Align APK
        run: zipalign -v 4 app/build/outputs/apk/release/radio-lux-fm-${{ env.VERSION }}.apk app/build/outputs/apk/release/radio-lux-fm-${{ env.VERSION }}-aligned.apk

      - name: Sign APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          apksigner sign --ks my-release-key.jks --ks-key-alias $KEY_ALIAS --ks-pass pass:$KEYSTORE_PASSWORD --key-pass pass:$KEY_PASSWORD --v2-signing-enabled true app/build/outputs/apk/release/radio-lux-fm-${{ env.VERSION }}-aligned.apk
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore my-release-key.jks app/build/outputs/bundle/release/radio-lux-fm-${{ env.VERSION }}.aab $KEY_ALIAS -storepass $KEYSTORE_PASSWORD -keypass $KEY_PASSWORD

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.VERSION }} \
            app/build/outputs/apk/release/radio-lux-fm-${{ env.VERSION }}-aligned.apk \
            app/build/outputs/bundle/release/radio-lux-fm-${{ env.VERSION }}.aab \
            --title "Release ${{ env.VERSION }}" \
            --generate-notes
