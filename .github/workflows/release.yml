name: Build and Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Decode keystore
        env:
          BASE64_KEYSTORE: ${{ secrets.BASE64_KEYSTORE }}
        run: |
          mkdir -p signing
          echo "$BASE64_KEYSTORE" | base64 --decode > signing/release-key.jks

      # versionCode is the build minute, not the tag. Play burns a version code permanently on first
      # upload, so deriving it from the semantic version means the version name can never go down.
      # A clock is monotonic on its own, which frees the tag to be any label.
      #
      # `yyMMdd * 2880 + minuteOfDay * 2`, the same scheme p-control-android uses: `yyMMddHHmm` does
      # not fit Play's 2100000000 ceiling, so the minute is packed as an offset inside the day. The
      # stride is 2880 rather than 1440 so every minute owns an even code and the odd one beside it,
      # which a TV bundle (phone code plus one) would need. Fits until the end of 2072; one release
      # per minute. `date -u`, never local time, and `%-H`/`%-M` because `$(( 08 ))` is octal.
      - name: Compute versionCode from build minute
        run: |
          day=$(date -u +%y%m%d)
          minute_of_day=$(( $(date -u +%-H) * 60 + $(date -u +%-M) ))
          echo "VERSION_CODE=$(( day * 2880 + minute_of_day * 2 ))" >> $GITHUB_ENV

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease -PversionName=${{ env.VERSION }} -PversionCode=${{ env.VERSION_CODE }}

      - name: Rename artifacts
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/radiozavr-${{ env.VERSION }}.apk
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/radiozavr-${{ env.VERSION }}.aab

      - name: Upload artifacts for next jobs
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/release/radiozavr-${{ env.VERSION }}.apk
            app/build/outputs/bundle/release/radiozavr-${{ env.VERSION }}.aab
            app/build/outputs/mapping/release/mapping.txt

  github-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.VERSION }} \
            artifacts/apk/release/radiozavr-${{ env.VERSION }}.apk \
            artifacts/bundle/release/radiozavr-${{ env.VERSION }}.aab \
            --title "Release ${{ env.VERSION }}" \
            --generate-notes
        working-directory: ${{ github.workspace }}

  play-store:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Decode Play Store credentials
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        run: echo "$PLAY_STORE_CREDENTIALS" | base64 --decode > fastlane/play-store-credentials.json

      - name: Upload to Play Store Internal Track
        env:
          AAB_PATH: ${{ github.workspace }}/artifacts/bundle/release/radiozavr-${{ env.VERSION }}.aab
          MAPPING_PATH: ${{ github.workspace }}/artifacts/mapping/release/mapping.txt
        run: bundle exec fastlane upload_internal

      # A tag reaches the testers without a second hand-run step: the release just put on internal
      # is carried into their closed track, where Play reviews it.
      - name: Promote to the testers' closed track
        run: bundle exec fastlane promote_to_testers

      - name: Remove decoded secrets from disk
        if: always()
        run: rm -f fastlane/play-store-credentials.json
