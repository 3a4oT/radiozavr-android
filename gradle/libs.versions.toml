[versions]
activityCompose = "1.13.0"
splashScreen = "1.2.0"
zxingCore = "3.5.4"
agp = "9.4.0"
composeBom = "2026.09.00"
firebaseBom = "34.19.0"
firebaseCrashlytics = "3.0.8"
googleServices = "4.5.0"
coroutinesVersion = "1.11.0"
datastorePreferences = "1.2.1"
kotlinxSerializationJson = "1.11.0"
retrofit = "3.0.0"
okhttp = "5.5.0"
hiltAndroidCompiler = "2.60.1"
ksp = "2.3.12"
kotlin = "2.4.20"
coreKtx = "1.19.0"
junit = "6.1.3"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
lifecycleComposeVersion = "2.10.0"
lifecycleVersion = "2.10.0"
media3Exoplayer = "1.11.1"
media3ExoplayerHls = "1.11.1"
navigationCompose = "2.10.1"
media3Session = "1.11.1"
hiltNavigationCompose = "1.4.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleComposeVersion" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleVersion" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Exoplayer" }
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3ExoplayerHls" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-ui = { module = "androidx.compose.ui:ui" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltAndroidCompiler" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hiltAndroidCompiler" }
junit = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version = "6.1.3" }
